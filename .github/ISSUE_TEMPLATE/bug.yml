name: Bug report
description: Something renders, behaves or reads wrong.
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component or package
      placeholder: Button, @helixds/tokens, the MCP server…
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
      description: Light or dark mode? Keyboard, mouse or screen reader? A screenshot helps.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest JSX that shows it, or a Storybook story and the steps.
      render: tsx
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "@helixds/react 0.2.0, React 19.1, Tailwind 4.1, Chrome 141"
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility
      options:
        - label: This is an accessibility problem (WCAG, keyboard, screen reader, contrast)
