<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design System Concepts</title>
<link rel="stylesheet" href="../../packages/tokens/dist/helix.css">
<link rel="stylesheet" href="explainer.css">
<style>
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  .concept { margin-bottom: 24px; }

  /* Eval */
  .ev-ok   { fill: var(--helix-color-icon-success); }
  .ev-fail { fill: var(--helix-color-icon-danger); }
  .ev-glyph { fill: none; stroke: var(--helix-primitive-color-gray-0); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* AGENTS.md */
  .ag-scan { fill: var(--helix-color-fill-primary-light); }
  .ag-hl   { fill: var(--helix-color-fill-success-light); }

  /* Contract — fill/stroke of the morphing shape are attributes (animated), so no class sets them */
  .ct-frame { fill: none; stroke: var(--helix-color-text-neutral-light); stroke-width: 1; stroke-dasharray: 4 4; }
  .ct-label { fill: var(--helix-primitive-color-gray-0); font-weight: 600; }
</style>
</head>
<body>
<main>

  <!-- ─────────────────────────── 01 · Eval ─────────────────────────── -->
  <section class="concept">
    <div class="explainer" id="eval">
      <svg viewBox="0 0 560 230" role="img"
           aria-label="An eval: a fixed prompt, the code an agent writes for it, each line checked against the system's rules, and a final score of 3 out of 4.">
        <g class="art">
          <g id="ev-sheet" class="pivot">
            <rect class="sheet" x="140" y="10" width="280" height="210" rx="12" />
            <line class="rule" x1="140" y1="46" x2="420" y2="46" />
          </g>
          <text class="mono muted ev-tab" x="158" y="33" font-size="12">prompt.md</text>
          <text class="mono muted ev-tab" x="158" y="33" font-size="12">output.tsx</text>

          <g id="ev-prompt" class="mono ink" font-size="13">
            <text class="ev-p" x="158" y="80">Create a save button with</text>
            <text class="ev-p" x="158" y="102">a loading state, using</text>
            <text class="ev-p" x="158" y="124">Helix. Primary, size m.</text>
          </g>

          <g id="ev-code" class="mono ink" font-size="13">
            <text class="ev-l" x="158" y="76">import { Button }</text>
            <text class="ev-l" x="158" y="100">&lt;Button</text>
            <text class="ev-l" x="174" y="124">variant="primary"</text>
            <text class="ev-l" x="174" y="148">isLoading={saving}</text>
            <text class="ev-l" x="174" y="172">onPress={save}</text>
            <text class="ev-l" x="158" y="196">&gt;Save&lt;/Button&gt;</text>
          </g>

          <g id="ev-marks">
            <g transform="translate(396 72)"><g class="ev-mark pivot"><circle class="ev-ok" r="9" /><path class="ev-glyph" d="M-4 0 L-1 3 L4 -3" /></g></g>
            <g transform="translate(396 120)"><g class="ev-mark pivot"><circle class="ev-ok" r="9" /><path class="ev-glyph" d="M-4 0 L-1 3 L4 -3" /></g></g>
            <g transform="translate(396 144)"><g class="ev-mark pivot"><circle class="ev-ok" r="9" /><path class="ev-glyph" d="M-4 0 L-1 3 L4 -3" /></g></g>
            <g transform="translate(396 168)"><g class="ev-mark pivot"><circle class="ev-fail" r="9" /><path class="ev-glyph" d="M-3.5 -3.5 L3.5 3.5 M3.5 -3.5 L-3.5 3.5" /></g></g>
          </g>

          <g id="ev-score" class="pivot">
            <rect class="sheet" x="200" y="70" width="160" height="90" rx="12" />
            <text class="ink" x="280" y="118" text-anchor="middle" font-size="32" font-weight="600">3 / 4</text>
            <text class="mono muted" x="280" y="142" text-anchor="middle" font-size="12">criteria met</text>
          </g>
        </g>
      </svg>
    </div>
  </section>

  <!-- ───────────────────────── 02 · AGENTS.md ───────────────────────── -->
  <section class="concept">
    <div class="explainer" id="agents">
      <svg viewBox="0 0 560 230" role="img"
           aria-label="AGENTS.md: a Markdown file at the root of the repo that an agent reads first. Its sections hold the stack, the rules and the commands, such as: no raw hex colors.">
        <g class="art">
          <g id="ag-sheet" class="pivot">
            <rect class="sheet" x="190" y="10" width="180" height="210" rx="10" />
            <line class="rule" x1="190" y1="46" x2="370" y2="46" />
            <text class="mono ink" x="206" y="33" font-size="13">AGENTS.md</text>
          </g>
          <rect id="ag-scan" class="ag-scan" x="198" y="56" width="164" height="20" rx="4" />
          <rect id="ag-hl" class="ag-hl" x="198" y="128" width="164" height="20" rx="4" />

          <rect class="bar pivot-left ag-bar ag-head" x="206" y="62"  width="64"  height="8" rx="4" />
          <rect class="bar pivot-left ag-bar"         x="206" y="86"  width="140" height="8" rx="4" />
          <rect class="bar pivot-left ag-bar ag-head" x="206" y="110" width="64"  height="8" rx="4" />
          <rect class="bar pivot-left ag-bar" id="ag-rulebar" x="206" y="134" width="124" height="8" rx="4" />
          <rect class="bar pivot-left ag-bar ag-head" x="206" y="158" width="88"  height="8" rx="4" />
          <rect class="bar pivot-left ag-bar"         x="206" y="182" width="112" height="8" rx="4" />

          <text class="mono accent ag-htext" x="206" y="70"  font-size="12">## Stack</text>
          <text class="mono accent ag-htext" x="206" y="118" font-size="12">## Rules</text>
          <text class="mono accent ag-htext" x="206" y="166" font-size="12">## Commands</text>
          <text class="mono ink pivot-left" id="ag-rule" x="206" y="142" font-size="12">no raw hex colors</text>
        </g>
      </svg>
    </div>
  </section>

  <!-- ───────────────────────── 03 · Contract ───────────────────────── -->
  <section class="concept">
    <div class="explainer" id="contract">
      <svg viewBox="0 0 560 230" role="img"
           aria-label="A component contract: Button.json lists the props. It becomes the coded button and the Figma component. Changing size from m to l in the contract updates both.">
        <g class="art">
          <rect id="ct-frame" class="ct-frame pivot" />
          <rect id="ct-shape" class="pivot" stroke-width="1" />
          <g id="ct-json" class="mono">
            <text class="muted ct-j" x="178" y="40" font-size="12">Button.json</text>
            <text class="ink ct-j" x="178" y="76"  font-size="13">{</text>
            <text class="ink ct-j" x="194" y="100" font-size="13">"variant": "primary",</text>
            <text class="ink ct-j" x="194" y="124" font-size="13">"size": "m",</text>
            <text class="ink ct-j" x="194" y="148" font-size="13">"icon": "IconSave"</text>
            <text class="ink ct-j" x="178" y="172" font-size="13">}</text>
          </g>
          <text id="ct-label" class="ct-label pivot" x="280" y="120" text-anchor="middle" font-size="17">Save</text>
          <text id="ct-tag-code"  class="mono muted" x="176" y="118" text-anchor="end" font-size="12">code</text>
          <text id="ct-tag-figma" class="mono muted" x="384" y="118" font-size="12">Figma</text>
          <text class="mono muted ct-size" x="280" y="196" text-anchor="middle" font-size="12">"size": "m"</text>
          <text class="mono accent ct-size" x="280" y="196" text-anchor="middle" font-size="12">"size": "l"</text>
        </g>
      </svg>
    </div>
  </section>
</main>

<script src="../../packages/core/node_modules/motion/dist/motion.js"></script>
<script src="explainer.js"></script>
<script>
  const { M, color } = Explainer;
  const hide = (els) => [].concat(els).forEach((el) => (el.style.opacity = 0));
  const show = (els) => [].concat(els).forEach((el) => (el.style.opacity = 1));
  const attrs = (el, a) => Object.entries(a).forEach(([k, v]) => el.setAttribute(k, v));

  // ── 01 · Eval — one sheet: prompt → code → checks → score ──────────────
  Explainer.mount(document.getElementById('eval'), {
    reset(q) {
      hide([q('#ev-sheet'), ...q.all('.ev-tab'), ...q.all('.ev-p'), ...q.all('.ev-l'), ...q.all('.ev-mark'), q('#ev-score')]);
      show([q('#ev-prompt'), q('#ev-code'), q('#ev-marks')]);
    },
    script(b, q) {
      const S = M.stagger, tabs = q.all('.ev-tab'), lines = q.all('.ev-l'), marks = q.all('.ev-mark');
      let t = 0.3;
      b.caption(null, 0, t);
      b.pop(q('#ev-sheet'), t);
      b.enter(tabs[0], t + 0.2);
      q.all('.ev-p').forEach((el, i) => b.slideIn(el, t + 0.3 + i * S));
      t += 0.3 + 2 * S + M.enter + M.hold;

      b.caption(0, 1, t);
      b.exit(tabs[0], t); b.exit(q('#ev-prompt'), t);
      b.enter(tabs[1], t + M.exit);
      lines.forEach((el, i) => b.slideIn(el, t + M.exit + i * S * 1.5));
      t += M.exit + 5 * S * 1.5 + M.enter + M.hold;

      b.caption(1, 2, t);
      marks.forEach((el, i) => b.pop(el, t + M.exit + i * S * 2.5));
      t += M.exit + 3 * S * 2.5 + M.emphasis + M.hold;

      b.caption(2, 3, t);
      b.exit(q('#ev-code'), t, 0.12); b.exit(q('#ev-marks'), t, 0.12);
      b.pop(q('#ev-score'), t + M.exit);
      return t + M.exit + M.emphasis + M.hold * 1.2;
    },
    still(q, caps) {
      show([q('#ev-sheet'), q.all('.ev-tab')[1], ...q.all('.ev-l'), ...q.all('.ev-mark')]);
      q.all('.ev-mark').forEach((el) => (el.style.transform = 'none'));
    },
  });

  // ── 02 · AGENTS.md — one file: appears → is read → sections → a rule ───
  Explainer.mount(document.getElementById('agents'), {
    reset(q) {
      hide([q('#ag-sheet'), q('#ag-scan'), q('#ag-hl'), ...q.all('.ag-bar'), ...q.all('.ag-htext'), q('#ag-rule')]);
      q('#ag-scan').style.transform = 'none';
    },
    script(b, q) {
      const S = M.stagger, scan = q('#ag-scan');
      let t = 0.3;
      b.caption(null, 0, t);
      b.pop(q('#ag-sheet'), t);
      q.all('.ag-bar').forEach((el, i) => b.add(el, { opacity: [0, 1], scaleX: [0, 1] }, t + 0.2 + i * S, M.enter, M.eEnter));
      t += 0.2 + 5 * S + M.enter + M.hold;

      b.caption(0, 1, t);
      const read = 2.0;
      b.enter(scan, t + M.exit);
      b.add(scan, { y: [0, 24, 48, 72, 96, 120] }, t + M.exit, read, M.eDraw);
      b.exit(scan, t + M.exit + read);
      t += M.exit + read + M.exit + M.hold * 0.6;

      b.caption(1, 2, t);
      q.all('.ag-head').forEach((el) => b.exit(el, t));
      q.all('.ag-htext').forEach((el, i) => b.slideIn(el, t + M.exit + i * S));
      t += M.exit + 2 * S + M.enter + M.hold;

      b.caption(2, 3, t);
      b.exit(q('#ag-rulebar'), t);
      b.enter(q('#ag-hl'), t + M.exit);
      b.slideIn(q('#ag-rule'), t + M.exit);
      b.add(q('#ag-rule'), { scale: [1, 1.08, 1] }, t + M.exit + M.enter, M.emphasis, M.eExit);
      return t + M.exit + M.enter + M.emphasis + M.hold * 1.2;
    },
    still(q, caps) {
      show([q('#ag-sheet'), q('#ag-hl'), ...q.all('.ag-bar:not(.ag-head):not(#ag-rulebar)'), ...q.all('.ag-htext'), q('#ag-rule')]);
    },
  });

  // ── 03 · Contract — one shape: JSON sheet → button → Figma → resized ───
  const PAGE = color('--helix-color-fill-page'), EDGE = color('--helix-color-border-neutral-dark'), BLUE = color('--helix-primitive-color-blue-600');
  const SHEET = { x: 160, y: 14, width: 240, height: 200, rx: 12 };
  const BTN_M = { x: 215, y: 90, width: 130, height: 48, rx: 8 };
  const BTN_L = { x: 205, y: 86, width: 150, height: 56, rx: 10 };
  const FRAME_M = { x: 203, y: 78, width: 154, height: 72, rx: 12 };
  const FRAME_L = { x: 193, y: 74, width: 174, height: 80, rx: 14 };
  // attrX/attrY move the rect's own x/y attributes (plain x/y would be a CSS translate).
  const geo = (a, b) => ({ attrX: [a.x, b.x], attrY: [a.y, b.y], width: [a.width, b.width], height: [a.height, b.height], rx: [a.rx, b.rx] });

  Explainer.mount(document.getElementById('contract'), {
    reset(q) {
      attrs(q('#ct-shape'), { ...SHEET, fill: PAGE, stroke: EDGE });
      attrs(q('#ct-frame'), FRAME_M);
      hide([q('#ct-shape'), q('#ct-frame'), ...q.all('.ct-j'), q('#ct-label'), q('#ct-tag-code'), q('#ct-tag-figma'), ...q.all('.ct-size')]);
      show(q('#ct-json'));
    },
    script(b, q) {
      const S = M.stagger, shape = q('#ct-shape'), frame = q('#ct-frame'), sizes = q.all('.ct-size');
      let t = 0.3;
      b.caption(null, 0, t);
      b.add(shape, { opacity: [0, 1], scale: [0.9, 1] }, t, M.emphasis, M.eEmphasis);
      q.all('.ct-j').forEach((el, i) => b.slideIn(el, t + 0.25 + i * S));
      t += 0.25 + 5 * S + M.enter + M.hold;

      b.caption(0, 1, t);
      b.exit(q('#ct-json'), t);
      const morph = M.emphasis * 1.4;
      b.add(shape, { ...geo(SHEET, BTN_M), fill: [PAGE, BLUE], stroke: [EDGE, BLUE] }, t + M.exit, morph, M.eEnter);
      b.enter(q('#ct-label'), t + M.exit + morph * 0.6);
      b.enter(q('#ct-tag-code'), t + M.exit + morph);
      t += M.exit + morph + M.enter + M.hold;

      b.caption(1, 2, t);
      b.pop(frame, t + M.exit);
      b.enter(q('#ct-tag-figma'), t + M.exit + M.emphasis * 0.5);
      t += M.exit + M.emphasis + M.hold;

      b.caption(2, 3, t);
      b.enter(sizes[0], t + M.exit);
      const change = t + M.exit + 0.9;
      b.exit(sizes[0], change); b.enter(sizes[1], change + M.exit);
      b.add(shape, geo(BTN_M, BTN_L), change + M.exit, M.emphasis, M.eEmphasis);
      b.add(frame, geo(FRAME_M, FRAME_L), change + M.exit + S, M.emphasis, M.eEmphasis);
      return change + M.exit + S + M.emphasis + M.hold * 1.2;
    },
    still(q, caps) {
      attrs(q('#ct-shape'), { ...BTN_M, fill: BLUE, stroke: BLUE });
      hide(q('#ct-json'));
      show([q('#ct-shape'), q('#ct-frame'), q('#ct-label'), q('#ct-tag-code'), q('#ct-tag-figma')]);
    },
  });
</script>
</body>
</html>
