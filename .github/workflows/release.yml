# Versions and publishes the @helixds/* packages with Changesets (.changeset/README.md).
# On every push to main: if there are pending changesets, opens or updates the "Version Packages" pull
# request (version bumps + each package's CHANGELOG.md). When that pull request merges there are none
# left, so the same job publishes whatever version isn't on npm yet (scripts/release-publish.mjs), tags
# it and creates the GitHub releases. Private packages are never published.
#
# OFF until launch day: the job only runs when the repository variable RELEASE_ENABLED is "true"
# (Settings → Secrets and variables → Actions → Variables). Launch steps: docs/launch-checklist.md.
# Publishing uses npm Trusted Publishing (OIDC, no token): each package needs a Trusted Publisher on
# npmjs.com pointing at this repo and this workflow file, set up after its first, manual publish.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    # Never from a fork, and never before launch.
    if: github.repository == 'MartaCondeDesign/helixds' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # No version here: pnpm/action-setup reads package.json's packageManager (pnpm@9.0.0); naming it twice fails.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      # Trusted Publishing needs npm ≥ 11.5.1; Node 22 ships an older one.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Version Packages pull request, or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELIX_TRACES: 'off'
