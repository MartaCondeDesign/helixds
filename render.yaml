# Render Blueprint — deploys the helix MCP server over HTTP so claude.ai / Claude mobile can use it
# as a custom connector. See packages/mcp/src/http.ts and AGENTS.md → "MCP server".
#
# Render → New → Blueprint → pick this repo. Once live, the connector URL is:
#   https://<service>.onrender.com/mcp/<HELIX_MCP_SECRET>
# (the secret is generated by Render — copy it from the service's Environment tab).
services:
  - type: web
    name: helix-mcp
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --filter @helix-ds/mcp... --filter @helix-ds/tokens... &&
      pnpm --filter @helix-ds/tokens build
    startCommand: pnpm --filter @helix-ds/mcp serve
    healthCheckPath: /health
    envVars:
      # Without it the endpoint would be a public /mcp readable by anyone with the URL — this repo
      # is private. Render generates a random value; it becomes part of the connector URL.
      - key: HELIX_MCP_SECRET
        generateValue: true
