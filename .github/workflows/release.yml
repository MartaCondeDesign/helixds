# Versions and publishes the @helixds/* packages with Changesets (.changeset/README.md).
# On every push to main: if there are pending changesets, opens or updates the "Version Packages" pull
# request (version bumps + each package's CHANGELOG.md). When that pull request merges there are none
# left, so the same job builds and publishes whatever version isn't on npm yet, then tags it and creates
# the GitHub releases. Private packages are never published.
# Not wired to npm yet, on purpose: there is no NPM_TOKEN secret. Plan for the first release — publish
# each package once by hand (npm requires a package to exist before it can trust a publisher), configure
# npm Trusted Publishing for this repo + this workflow on each package, then switch this job to OIDC (no
# token; bypass-2FA publish tokens stop working in January 2027). Provenance also needs the repo public.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    # Never from a fork: it has neither the secret nor a reason to publish.
    if: github.repository == 'MartaCondeDesign/helixds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # No version here: pnpm/action-setup reads package.json's packageManager (pnpm@9.0.0); naming it twice fails.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Version Packages pull request, or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          HELIX_TRACES: 'off'
